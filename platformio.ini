[platformio]
default_envs =
  wt32-eth01
  waveshare-esp32-s3-eth

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  knolleary/PubSubClient @ ^2.8
  lovyan03/LovyanGFX @ ^1.2.7
extra_scripts =
  post:scripts/rename_firmware.py

[env:wt32-eth01]
platform = espressif32
board = esp32dev
board_build.partitions = default.csv
build_flags =
  -D WIFIWATCH_HW_WT32

custom_firmware_base = ESP-WiFiWatch-v0.4.8-WT32-ETH01
custom_factory_chip = esp32
custom_bootloader_offset = 0x1000
custom_app_offset = 0x10000

[env:waveshare-esp32-s3-eth]
; Arduino-ESP32 3.x is used here because its native ETH class supports
; SPI Ethernet (W5500) through the ESP-IDF network stack.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/waveshare_16MB_ota.csv
build_flags =
  -D WIFIWATCH_HW_WAVESHARE_S3_ETH
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

custom_firmware_base = ESP-WiFiWatch-v0.4.8-Waveshare-ESP32-S3-ETH
custom_factory_chip = esp32s3
custom_bootloader_offset = 0x0
custom_app_offset = 0x10000
